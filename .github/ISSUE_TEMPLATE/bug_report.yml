name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Please **never paste client IDs or secrets** into an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what you got instead.
      placeholder: |
        covers --include all https://tidal.com/artist/3974492
        Expected … but got …
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output, including any error message.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `covers --version`.
      placeholder: covers 0.1.0
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: Service
      options: [TIDAL, Spotify, Both, Not service-specific]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11, …
