name: Feature request
description: Suggest an idea for covers
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Ideas
      description: How it could work, alternatives you've considered, examples.
