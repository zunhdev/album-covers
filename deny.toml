# cargo-deny checks the dependency tree: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[advisories]
# Fail on known vulnerabilities, unmaintained and unsound crates, and yanked versions.
yanked = "deny"

[licenses]
# Permissive licenses only for anything that ends up in the binary.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla's CA certificate list)
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# This crate itself is not published (see `publish = false` in Cargo.toml).
private = { ignore = true }

[[licenses.exceptions]]
# Used by mockito, a test-only dependency; not part of the binary.
crate = "colored"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
