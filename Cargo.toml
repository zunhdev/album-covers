[package]
name = "album-covers"
version = "0.1.3"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zunhdev/album-covers"
# Not on crates.io (yet); install from the Git repository.
publish = false
description = "List an artist's albums with links to their cover art, from a Spotify or TIDAL artist link"
readme = "README.md"
keywords = ["spotify", "tidal", "album", "cover-art", "cli"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "covers"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
dotenvy = "0.15.7"
etcetera = "0.11.0"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.5.2"

[dev-dependencies]
assert_cmd = "2.2.2"
indoc = "2.0.8"
mockito = "1.7.2"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every fallible function returns the crate's `Error`, whose variants are documented.
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
